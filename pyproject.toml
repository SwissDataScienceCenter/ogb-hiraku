[project]
name = "benchmark"
version = "0.1.0"
description = "OGBG-MolHIV fingerprint baseline and Renku agent coding environment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow>=3.18.0",
    "numpy<2",
    "ogb>=1.3.6,<1.4",
    "pandas",
    "rdkit",
    "scikit-learn",
    "torch<2.6",
    "uv",
]

# This fingerprint/logistic-regression baseline does not use CUDA. Keep Linux
# images and session caches small while using the normal PyPI wheel on macOS.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
